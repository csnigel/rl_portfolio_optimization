[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-portfolio-optimization"
version = "0.1.0"
description = "PPO portfolio allocation with macro features and HMM regime analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2.0",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "contourpy>=1.0.1,<1.4",
  "scikit-learn>=1.3",
  "scipy>=1.11,<1.15",
  "torch>=2.0",
  "hmmlearn>=0.3",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14.0"]
data = [
  "fredapi>=0.5",
  "openpyxl>=3.1",
  "seaborn>=0.13",
  "statsmodels>=0.14",
  "yfinance>=0.2",
]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/csnigel/rl_portfolio_optimization"
Report = "https://github.com/csnigel/rl_portfolio_optimization/blob/main/docs/Machine%20Learning%20II%20Project%20Report.pdf"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
